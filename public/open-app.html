<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Veversal</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --blue: #2563eb;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(165deg, #dbeafe 0%, var(--bg) 45%, #fff 100%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      display: block;
      width: min(220px, 58vw);
      height: auto;
      margin: 0 auto 20px;
      filter: drop-shadow(0 8px 24px rgba(15, 23, 42, 0.12));
    }
    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
    }
    .brand.sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 15px;
    }
    .btn {
      display: block;
      width: 100%;
      text-decoration: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 650;
      margin: 0 0 12px;
    }
    .btn-primary {
      background: var(--ink);
      color: #fff;
    }
    .btn-secondary {
      background: #fff;
      color: var(--blue);
      border: 2px solid var(--blue);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      font-weight: 550;
      font-size: 14px;
    }
    .hint {
      margin-top: 4px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.45;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img
      id="logo"
      class="logo"
      src="/veversal-brand-bg.png"
      width="220"
      height="309"
      alt="Veversal"
    />
    <h1 class="brand sr-only">Veversal</h1>
    <p id="msg">Избери как да продължиш</p>
    <a id="openApp" class="btn btn-primary" href="#">Отвори приложението</a>
    <a id="appstore" class="btn btn-secondary" href="https://apps.apple.com/app/id6820957515">App Store</a>
    <a id="play" class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.mihailovv.vhrfrontend">Google Play</a>
    <a id="web" class="btn btn-ghost" href="/">Продължи в браузъра</a>
    <p class="hint" id="hint"></p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var raw = params.get('to') || '/';
      var lang = (params.get('lang') || '').toLowerCase();
      var en = lang === 'en' || raw.indexOf('/en/') === 0;

      var path;
      try {
        if (/^https?:\/\//i.test(raw)) {
          var u = new URL(raw);
          path = u.pathname + u.search;
        } else {
          path = raw.charAt(0) === '/' ? raw : '/' + raw;
        }
      } catch (e) {
        path = '/';
      }
      path = path.replace(/^\/+/, '');
      // Native linking routes are language-free (dashboard/vehicles/:id).
      // Email links often include /bg/ or /en/ — strip for scheme/intent only.
      var nativePath = path.replace(/^(en|bg|de|it|fr|es)\//i, '');
      nativePath = nativePath.replace(/^\/+/, '');

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var playUrl = 'https://play.google.com/store/apps/details?id=com.mihailovv.vhrfrontend';
      // https listing (works in Mail) + itms-apps for installed App Store app
      var appStoreHttps = 'https://apps.apple.com/bg/app/id6820957515';
      var appStoreNative = 'itms-apps://apps.apple.com/app/id6820957515';
      // Primary brand scheme; service1001 kept for older Android installs only.
      var schemeUrl = 'veversal://' + nativePath;
      var legacySchemeUrl = 'service1001://' + nativePath;
      var intentUrl =
        'intent://' + nativePath +
        '#Intent;scheme=veversal;package=com.mihailovv.vhrfrontend;S.browser_fallback_url=' +
        encodeURIComponent(playUrl) + ';end';
      var legacyIntentUrl =
        'intent://' + nativePath +
        '#Intent;scheme=service1001;package=com.mihailovv.vhrfrontend;S.browser_fallback_url=' +
        encodeURIComponent(playUrl) + ';end';
      var webUrl = '/' + path;

      var openBtn = document.getElementById('openApp');
      var playBtn = document.getElementById('play');
      var storeBtn = document.getElementById('appstore');
      var webBtn = document.getElementById('web');
      var msg = document.getElementById('msg');
      var hint = document.getElementById('hint');
      var logo = document.getElementById('logo');
      if (logo) {
        logo.src = en ? '/veversal-brand-en.png' : '/veversal-brand-bg.png';
      }

      playBtn.href = playUrl;
      storeBtn.href = appStoreHttps;
      webBtn.href = webUrl;

      if (isAndroid) {
        openBtn.href = intentUrl;
        storeBtn.classList.add('hidden');
        if (en) {
          msg.textContent = 'Open Veversal or get it from Play';
          openBtn.textContent = 'Open the app';
          playBtn.textContent = 'Get on Google Play';
          webBtn.textContent = 'Continue in browser';
          hint.textContent = 'If the app is installed, “Open the app” launches it. Otherwise use Google Play.';
        } else {
          msg.textContent = 'Отвори Veversal или го вземи от Play';
          openBtn.textContent = 'Отвори приложението';
          playBtn.textContent = 'Изтегли от Google Play';
          webBtn.textContent = 'Продължи в браузъра';
          hint.textContent = 'Ако app-ът е инсталиран, „Отвори приложението“ го пуска. Иначе ползвай Google Play.';
        }
        // Android: try brand scheme, then legacy scheme for older APKs.
        setTimeout(function () {
          window.location.href = intentUrl;
          setTimeout(function () {
            window.location.href = legacyIntentUrl;
          }, 700);
        }, 200);
        return;
      }

      if (isIOS) {
        playBtn.classList.add('hidden');
        openBtn.href = schemeUrl;
        // Do NOT auto-redirect on iOS — Mail/Safari need a real tap.
        // Current TestFlight builds may still only know service1001 until rebuild.
        openBtn.addEventListener('click', function (ev) {
          ev.preventDefault();
          window.location.href = schemeUrl;
          setTimeout(function () {
            window.location.href = legacySchemeUrl;
          }, 500);
        });
        storeBtn.addEventListener('click', function (ev) {
          ev.preventDefault();
          window.location.href = appStoreNative;
          setTimeout(function () {
            window.location.href = appStoreHttps;
          }, 400);
        });
        if (en) {
          msg.textContent = 'Open Veversal, or continue in the browser';
          openBtn.textContent = 'Open the app';
          storeBtn.textContent = 'Open App Store';
          webBtn.textContent = 'Continue in browser';
          hint.textContent =
            'If the app does not open, install Veversal from the App Store or continue in the browser.';
        } else {
          msg.textContent = 'Отвори Veversal, или продължи в браузъра';
          openBtn.textContent = 'Отвори приложението';
          storeBtn.textContent = 'Отвори App Store';
          webBtn.textContent = 'Продължи в браузъра';
          hint.textContent =
            'Ако приложението не се отвори, инсталирай Veversal от App Store или продължи в браузъра.';
        }
        return;
      }

      // Desktop / other: show both stores, no auto scheme.
      openBtn.href = schemeUrl;
      if (en) {
        msg.textContent = 'Continue in the browser, or install the mobile app';
        openBtn.textContent = 'Try opening the app';
        playBtn.textContent = 'Google Play';
        storeBtn.textContent = 'App Store';
        webBtn.textContent = 'Continue in browser';
        hint.textContent = 'On a phone with Veversal installed, “Open the app” works best.';
      } else {
        msg.textContent = 'Продължи в браузъра или инсталирай мобилното приложение';
        openBtn.textContent = 'Опитай да отвориш приложението';
        playBtn.textContent = 'Google Play';
        storeBtn.textContent = 'App Store';
        webBtn.textContent = 'Продължи в браузъра';
        hint.textContent = 'На телефон с инсталиран Veversal бутонът „Отвори приложението“ работи най-добре.';
      }
    })();
  </script>
</body>
</html>
